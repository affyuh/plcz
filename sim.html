<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PLC七段数码管仿真（共阴极 Q0.0~Q0.7 a b c d e f g dp）</title>
<style>
/* 工业深色控制台风格 */
*{box-sizing:border-box;margin:0;padding:0;font-family:"Microsoft Yahei",sans-serif}
body{background:#121417;color:#e8e8e8;padding:20px}
.container{max-width:900px;margin:0 auto;background:#1e2228;padding:24px;border-radius:10px;border:1px solid #393f48}
h1{text-align:center;font-size:22px;margin-bottom:20px;color:#42a5f5}
.row{display:flex;gap:24px;flex-wrap:wrap;margin-bottom:20px}
.panel{flex:1;min-width:320px;background:#272c33;padding:18px;border-radius:8px;border:1px solid #3a404a}
.panel h2{font-size:16px;margin-bottom:14px;color:#90caf9;border-bottom:1px solid #3a404a;padding-bottom:8px}

/* 七段数码管容器 */
.seg-display{width:160px;height:280px;margin:0 auto;position:relative;background:#111;border-radius:12px;padding:10px}
.seg{position:absolute;background:#222;border-radius:4px;transition:background 0.2s}
.seg.on{background:red;box-shadow:0 0 12px #ff2222,0 0 22px #ff4444}
/* a b c d e f g dp 位置 */
.seg-a{top:10px;left:30px;width:100px;height:14px}
.seg-b{top:24px;right:10px;width:14px;height:90px}
.seg-c{bottom:24px;right:10px;width:14px;height:90px}
.seg-d{bottom:10px;left:30px;width:100px;height:14px}
.seg-e{bottom:24px;left:10px;width:14px;height:90px}
.seg-f{top:24px;left:10px;width:14px;height:90px}
.seg-g{top:130px;left:30px;width:100px;height:14px}
.seg-dp{bottom:18px;right:22px;width:16px;height:16px;border-radius:50%}

/* PLC Q输出指示灯 */
.q-list{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.q-item{display:flex;align-items:center;gap:8px;background:#1e2228;padding:8px;border-radius:6px}
.led{width:20px;height:20px;border-radius:50%;background:#222;border:1px solid #444;transition:all 0.2s}
.led.on{background:#0f0;box-shadow:0 0 8px #0f0,0 0 16px #3f3}

/* 数字按钮区域 */
.num-buttons{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin:12px 0}
button{padding:10px;font-size:18px;border:none;border-radius:6px;background:#39404b;color:#fff;cursor:pointer}
button:hover{background:#4a5361}
.input-area{display:flex;gap:8px;align-items:center;margin-top:12px}
#numInput{flex:1;padding:10px;font-size:18px;background:#111;border:1px solid #444;color:#fff;border-radius:6px}

.info-line{padding:6px 0;font-size:15px;border-bottom:1px solid #333}
.label{color:#999;width:120px;display:inline-block}
</style>
</head>
<body>
<div class="container">
<h1>PLC 七段数码管仿真演示｜共阴极 Q0.0~Q0.7 → a b c d e f g dp</h1>
<div class="row">
  <!-- 数码管面板 -->
  <div class="panel">
    <h2>七段数码管显示</h2>
    <div class="seg-display">
      <div class="seg seg-a" data-seg="a"></div>
      <div class="seg seg-b" data-seg="b"></div>
      <div class="seg seg-c" data-seg="c"></div>
      <div class="seg seg-d" data-seg="d"></div>
      <div class="seg seg-e" data-seg="e"></div>
      <div class="seg seg-f" data-seg="f"></div>
      <div class="seg seg-g" data-seg="g"></div>
      <div class="seg seg-dp" data-seg="dp"></div>
    </div>
  </div>

  <!-- PLC Q输出状态面板 -->
  <div class="panel">
    <h2>PLC输出 Q0.0 ~ Q0.7</h2>
    <div class="q-list">
      <div class="q-item"><div class="led" id="q00"></div> Q0.0(a)</div>
      <div class="q-item"><div class="led" id="q01"></div> Q0.1(b)</div>
      <div class="q-item"><div class="led" id="q02"></div> Q0.2(c)</div>
      <div class="q-item"><div class="led" id="q03"></div> Q0.3(d)</div>
      <div class="q-item"><div class="led" id="q04"></div> Q0.4(e)</div>
      <div class="q-item"><div class="led" id="q05"></div> Q0.5(f)</div>
      <div class="q-item"><div class="led" id="q06"></div> Q0.6(g)</div>
      <div class="q-item"><div class="led" id="q07"></div> Q0.7(dp)</div>
    </div>

    <div style="margin-top:20px">
      <h2>数据信息</h2>
      <div class="info-line"><span class="label">当前数字：</span><span id="showNum">0</span></div>
      <div class="info-line"><span class="label">8位二进制：</span><span id="binCode">00111111</span></div>
      <div class="info-line"><span class="label">十六进制：</span><span id="hexCode">0x3F</span></div>
    </div>
  </div>
</div>

<div class="panel">
  <h2>数字输入（0~9）</h2>
  <div class="num-buttons">
    <button onclick="setNum(0)">0</button>
    <button onclick="setNum(1)">1</button>
    <button onclick="setNum(2)">2</button>
    <button onclick="setNum(3)">3</button>
    <button onclick="setNum(4)">4</button>
    <button onclick="setNum(5)">5</button>
    <button onclick="setNum(6)">6</button>
    <button onclick="setNum(7)">7</button>
    <button onclick="setNum(8)">8</button>
    <button onclick="setNum(9)">9</button>
  </div>
  <div class="input-area">
    <input type="text" id="numInput" placeholder="键盘输入0~9，其他字符自动忽略">
    <button onclick="readInput()">确认</button>
  </div>
</div>
</div>

<script>
/*
共阴极七段码表：Q0.0~Q0.7 对应 a b c d e f g dp
共阴极规则：1=点亮，0=熄灭
段码顺序：bit0:a(Q0.0), bit1:b(Q0.1), bit2:c(Q0.2), bit3:d(Q0.3), bit4:e(Q0.4), bit5:f(Q0.5), bit6:g(Q0.6), bit7:dp(Q0.7)
数组下标=显示数字0~9，值为8位段码
*/
const segCodeTable = [
  0b00111111, // 0 a,b,c,d,e,f亮 g灭 dp灭
  0b00000110, // 1 b,c亮
  0b01011011, // 2 a,b,g,e,d亮
  0b01001111, // 3 a,b,g,c,d亮
  0b01100110, // 4 f,g,b,c亮
  0b01101101, // 5 a,f,g,c,d亮
  0b01111101, // 6 a,f,g,c,d,e亮
  0b00000111, // 7 a,b,c亮
  0b01111111, // 8 全部段亮，dp灭
  0b01101111  // 9 a,b,c,d,f,g亮 dp灭
];

// 段顺序映射：bit0~bit7
const segNameList = ['a','b','c','d','e','f','g','dp'];

// 页面元素
const elShowNum = document.getElementById('showNum');
const elBinCode = document.getElementById('binCode');
const elHexCode = document.getElementById('hexCode');
const elNumInput = document.getElementById('numInput');

// 设置数字，刷新数码管+PLC指示灯+信息
function setNum(n){
  if(isNaN(n) || n<0 || n>9) return;
  n = parseInt(n);
  const code = segCodeTable[n];

  // 更新文本信息
  elShowNum.textContent = n;
  let binStr = code.toString(2).padStart(8,'0');
  elBinCode.textContent = binStr;
  elHexCode.textContent = "0x"+code.toString(16).toUpperCase().padStart(2,'0');

  // 更新七段数码管
  for(let i=0;i<8;i++){
    const segName = segNameList[i];
    const segDom = document.querySelector(`.seg[data-seg="${segName}"]`);
    const bitVal = (code >> i) & 1;
    if(bitVal ===1){
      segDom.classList.add('on');
    }else{
      segDom.classList.remove('on');
    }
    // 更新PLC Q指示灯 Q0.0~Q0.7
    const qDom = document.getElementById(`q0${i}`);
    if(bitVal ===1){
      qDom.classList.add('on');
    }else{
      qDom.classList.remove('on');
    }
  }
}

// 读取输入框
function readInput(){
  const val = elNumInput.value.trim();
  const n = parseInt(val);
  setNum(n);
  elNumInput.value="";
}

// 键盘回车触发
elNumInput.addEventListener('keydown',function(e){
  if(e.key === 'Enter'){
    readInput();
  }
});

// 页面默认初始显示0
setNum(0);
</script>
</body>
</html>
